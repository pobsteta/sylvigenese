# Réglages d'une exécution de sylvigenese (spec §1, §2, §6, §7, §9 ; ADR 0001).
# Conforme à contracts/json/config.schema.json : une clé inconnue est refusée.
# Vérifier : python3 contracts/validate config config.yml

schema_version: 1
zone: zone_fictive        # données sous data/<zone>/ ; jeu d'essai : tests/fixtures/zone_fictive
crs: EPSG:2154
grid:
  resolution_m: 25        # ADR 0001
management: none          # aucune gestion sylvicole en v1 (spec §6)

# Facultatif : chemins hors dépôt, à renseigner sur la machine qui les a.
# external:
#   tarif_nemeton_dir: /chemin/vers/tarif-nemeton   # lu par import_tarif seul
#   raf20_grid: /chemin/vers/RAF20.gtx

# Réglages de simulate (spec §1, §6). Le bloc est exigé quand simulate tourne : sans lui, ou sans
# l'une de ses quatre clés level, seed, t0, years, simulate s'arrête (code 2) ; aucune valeur par
# défaut n'est prise en silence. `threads` reste facultatif (sans lui : un fil).
simulate:
  level: massif
  seed: 42                # graine du générateur à compteur (bench/SPEC.md)
  t0: 2022                # année de départ ; jeu fictif : année du vol le plus récent de chm_date.tif
                          # (vols de 2021 et 2022 ; la hauteur ne se recule pas, décision de
                          # l'orchestrateur du 25/11/2026) ; à fixer par zone réelle
  years: 100              # horizon (défaut du BRIEF §8)
#  threads: 4
  # Mode de recrutement (M5a, décision de Pascal Q4 du 26/11/2026, mission 060) : `ifn_direct` est le
  # recrutement de M3a (référence tests/m3/reference/nominal.json) ; `cohorts` est la régénération par
  # cohortes de semis, qui exige le bloc `regeneration` ci-dessous. Le moteur des cohortes existe
  # (mission 062), mais le massif reste en `ifn_direct` : le jeu fictif (tests/fixtures/zone_fictive)
  # n'a pas encore de params/regeneration.parquet, sans lequel `cohorts` s'arrête (code 2) ; la bascule
  # attend ce fichier et sa référence technique, par décision de l'orchestrateur.
  recruitment: ifn_direct
  # Bloc exigé en mode `cohorts` (réglages numériques, non écologiques ; valeurs à fixer à la bascule) :
  # regeneration:
  #   kernel_truncation_cells: <demi-largeur du noyau tronqué, en cellules de 25 m ; = zone tampon>
  #   zero_threshold: <seuil relatif de la règle |Q|, spec §6>
  # Bloc exigé si `level: ser` (ADR 0006, projet) :
  # ser:
  #   diameter_class_width_cm: <largeur d'une classe de diamètre>
  #   diameter_classes: <nombre de classes K, dernière ouverte>
  #   write_step: <une année écrite sur N>

# Bloc assets (mission 044, plan de la suite de M4a, T1) : dès que sim/ existe, assets écrit une
# tuile et une fiche pour t0 puis toutes les `year_step` années ; sans ce bloc, il s'arrête (code 2).
assets:
  year_step: 10           # une année sur 10 (BRIEF §9 : « pas de 5 ou 10 ans »)
  # Modèles d'arbres .glb (M6a, mission 068, plan m6a T3) : réglages d'AFFICHAGE, provisoires, « illustration,
  # non mesurée », jamais lus par le moteur. Les dimensions d'un exemplaire (D, H, hbh, Rh, b_cible) ne sont
  # pas ici : sim/trees, calibration de tarif-nemeton, repli params/model_dimensions.csv (décision Q6).
  models:
    provisoire: true
    # exemplars_dir: /chemin/vers/exemplaires   # dossier Parquet (contrat assets.exemplars) ; à fixer par la mission D
    triangle_budgets: {lod0: 20000, lod1: 2000, lod2: 200}   # plan T3 ; à mesurer (mission H)
    screencoverage: [0.30, 0.05, 0.005]                       # MSFT_screencoverage écrit dans chaque .glb

# Constantes d'affichage de viewer-massif (M6a, mission 068 ; décisions de Pascal Q2 et Q4 du 26/11/2026).
# PROVISOIRE : illustration, non mesurée ; signalées dans la vue ; aucune n'est lue par le moteur. Le nombre de
# brins d'herbe suit herb_cover de la cellule et le nombre de semis suit sim/cells : seule l'apparence est ici.
viewer:
  provisoire: true
  mention: "apparence de l'herbe, du feuillage et des niveaux de détail : illustration, non mesurée"
  grass:
    radius_m: 40
    recenter_distance_m: 10
    max_instances: 200000
    blade_height_m: 0.35
    blades_per_m2_at_full_cover: 100
    color: "#5b7f3a"
  seedlings:
    max_instances: 20000   # plafond de dessin des semis (illustration, non mesurée) ; les effectifs restent ceux de sim/cells
  foliage:
    card_size_m: 0.6
    color_by_group: {feuillu: "#4f7a32", resineux: "#2f5a3a"}
  lod:
    fade_margin_m: 5
