<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sylvigenese</title>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #1d2a24; color: #fff; }
  #vue { position: absolute; inset: 0; }
  #bandeau { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: 8px 14px; background: #7a3b00;
             font-size: 22px; font-weight: 700; display: flex; gap: 18px; align-items: baseline; }
  #bandeau small { font-size: 14px; font-weight: 400; }
  #legende { position: absolute; left: 10px; top: 56px; z-index: 5; background: rgba(0,0,0,.72); padding: 8px 10px;
             border-radius: 6px; font-size: 13px; max-height: 60%; overflow: auto; }
  #legende h2 { margin: 0 0 4px; font-size: 15px; }
  #legende-corps div { display: flex; align-items: center; gap: 6px; line-height: 1.3; white-space: nowrap; }
  #legende-corps i { width: 14px; height: 14px; display: inline-block; border: 1px solid #fff8; }
  #bandeau #annee-grand { font-size: 34px; letter-spacing: 1px; }
  #fiche { position: absolute; right: 10px; top: 56px; width: 360px; z-index: 5; background: rgba(255,255,255,.96); color: #111;
           padding: 10px 14px; border-radius: 6px; font-size: 16px; max-height: calc(100% - 175px); overflow: auto; }
  #fiche.large { width: 640px; font-size: 14px; }
  #fiche .tete { font-size: 18px; font-weight: 700; margin: 4px 0; }
  #fiche table.evolution { border-collapse: collapse; font-size: 13px; margin: 6px 0; width: 100%; }
  #fiche table.evolution caption { text-align: left; font-size: 12px; color: #a63b00; padding-bottom: 2px; }
  #fiche table.evolution th, #fiche table.evolution td { border-bottom: 1px solid #ccd; padding: 2px 4px; text-align: right; }
  #fiche table.evolution th:nth-child(n+6), #fiche table.evolution td:nth-child(n+6) { text-align: left; }
  #fiche table.evolution tr.choisie td { background: #fff1b8; font-weight: 700; }
  #fiche table.evolution td.haut { color: #a63b00; }
  #legende-g-barre { height: 14px; width: 220px; border: 1px solid #fff8; margin-top: 4px; }
  #legende-g-reperes { display: flex; justify-content: space-between; width: 222px; }
  #legende-g-mention, #legende-g-hors { max-width: 240px; white-space: normal; font-size: 12px; margin-top: 4px; }
  #legende [hidden], #pied [hidden] { display: none; }
  #pied button { font-size: 16px; padding: 2px 10px; }
  #fiche[hidden] { display: none; }
  #fiche h2 { margin: 0 0 4px; font-size: 20px; }
  #fiche .prov { color: #a63b00; font-weight: 700; }
  #fiche dl { margin: 6px 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  #fiche dt { color: #444; }
  #fiche dd { margin: 0; font-weight: 600; }
  #fiche ul { margin: 4px 0; padding-left: 18px; font-size: 13px; color: #333; }
  #fiche code { display: block; padding: 6px; background: #e9eee9; user-select: all; font-size: 13px; word-break: break-all; }
  #fiche button { margin-top: 4px; font-size: 15px; padding: 6px 12px; }
  #fiche .fermer { position: absolute; right: 8px; top: 6px; margin: 0; }
  #pied { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 6px 14px; background: rgba(0,0,0,.78);
          font-size: 13px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  #pied input[type=range] { width: 160px; }
  #message { position: absolute; left: 50%; top: 45%; transform: translateX(-50%); z-index: 6; background: rgba(0,0,0,.8);
             padding: 12px 20px; border-radius: 6px; font-size: 20px; }
  #message[hidden] { display: none; }
  #message.erreur { background: #8b0000; }
</style>
</head>
<body>
<div id="vue"></div>
<div id="bandeau">Résultat provisoire <span id="annee-grand"></span> <span id="bandeau-texte"><small>état initial, jeu et valeurs provisoires : ne rien en conclure d'écologique</small></span></div>
<div id="message">Chargement…</div>
<div id="legende" aria-label="Légende">
  <div id="legende-g" hidden>
    <h2 id="legende-g-titre">Surface terrière G (m²/ha)</h2>
    <div id="legende-g-barre"></div>
    <div id="legende-g-reperes"></div>
    <div>m²/ha</div>
    <div id="legende-g-mention"></div>
    <div id="legende-g-hors"></div>
  </div>
  <div id="legende-types"><h2 id="legende-titre">Types de végétation</h2><div id="legende-corps"></div></div>
</div>
<div id="fiche" data-testid="cell-sheet" hidden></div>
<div id="pied">
  <span><button id="annee-prec" type="button" aria-label="Année précédente" disabled>◀</button>
    <label>Année <input id="annee" type="range" list="annees-liste" disabled></label>
    <button id="annee-suiv" type="button" aria-label="Année suivante" disabled>▶</button>
    <span id="annee-texte"></span></span>
  <datalist id="annees-liste"></datalist>
  <label id="choix-carte" hidden>Carte au sol <select id="carte-sol"><option value="g">surface terrière de l'année</option><option value="types">types de végétation (état initial)</option></select></label>
  <label>Opacité de la carte <input id="opacite" type="range" min="0" max="1" step="0.05"></label>
  <span id="etat-terrain"></span>
  <span id="etat-fond"></span>
  <span id="etat-arbres"></span>
  <span id="etat-source"></span>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
