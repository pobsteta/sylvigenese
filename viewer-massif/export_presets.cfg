; Export de viewer-massif : Linux seul (Q5, décision de Pascal du 26/11/2026 ; plan m6a T9, T10), Godot 4.6.3.
; Fichier écrit par la mission 073 (CI) ; la vue elle-même est celle de la mission 072.
; Commande (la CI donne le chemin de sortie) :
;   godot --headless --path viewer-massif --export-release "Linux" <chemin>/viewer-massif.x86_64
; Gabarit utilisé : linux_release.x86_64 de la version 4.6.3.stable (seul extrait du .tpz par la CI).
; Les tests (GUT) et l'addon GUT ne sont pas embarqués dans le binaire.

