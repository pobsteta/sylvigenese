[package]
name = "bench-sim"
version = "0.1.0"
edition = "2024"
description = "Banc d'essai du moteur de simulation (variante Rust) — exploration jetable, voir bench/SPEC.md"
license = "GPL-3.0-or-later"

[lib]
name = "bench_sim"
path = "src/lib.rs"

[[bin]]
name = "bench-sim"
path = "src/main.rs"

[dependencies]
rustfft = "6"
rayon = "1"

[profile.release]
opt-level = 3
overflow-checks = true

[profile.test]
opt-level = 3
overflow-checks = true
