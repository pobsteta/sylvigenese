name: CI
# Le nom « CI » est lu par release.yml (workflow_run) : ne pas le changer.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Chaînes d'outils figées (mission 014). Python : python/pyproject.toml (>= 3.13) ;
  # Node : viewer-web/package.json (>= 22.18) ; R : testthat, yaml et terra, binaires r2u (CRAN du jour, voir le résumé).
  RUST_VERSION: "1.97.0"
  PYTHON_VERSION: "3.13.14"  # dernière 3.13 téléchargeable par uv 0.11.32
  NODE_VERSION: "22.23.5"
  GODOT_VERSION: "4.6.3-stable"  # mission 073 ; empreintes SHA-512 publiées par la release (docs/referentiels/godot-gut.md)
  GODOT_ZIP_SHA512: "a035258da32b77f966a5376f9fa29c30a6adde826a85ba918e1605bd1fc9823eba7d85f1dd5e748956bd2ba72827c0025ffa11bb82aec91128c407a2e723c99c"  # Godot_v4.6.3-stable_linux.x86_64.zip
  GODOT_TPZ_SHA512: "da606b61c10157844f8300172df374472665f95015495cb1a7cd132c40ede404faa96cc1016a4b9662db9909ddea69632c4948b2cd11163438dad4808881fb68"  # Godot_v4.6.3-stable_export_templates.tpz (pas la version mono)
  PLAYWRIGHT_VERSION: "1.65.1"

jobs:
  # Découpage en jobs parallèles (mission 043). Chaque job prépare ses outils lui-même et ne lit
  # la sortie d'aucun autre. La liste des tests est celle de tools/ci/run_tests.sh, répartie en sections.
  # Le workflow « CI » ne conclut qu'après tous ses jobs et reste rouge si l'un échoue (c'est ce que lit release.yml).

  # Scripts de release : à préserver (release.yml s'appuie sur eux). Sans dépendance.
  scripts-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Tester la décision de release
        run: .github/scripts/test-release-necessaire.sh

      - name: Tester le calcul de version calendaire
        run: .github/scripts/test-version-calendaire.sh


  # R (testthat). Python sert au validateur appelé par les tests R.
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # R : r2u fournit R et les paquets CRAN en binaires (apt), donc sans compilation.
      - name: R (r2u)
        uses: eddelbuettel/github-actions/r2u-setup@a28627a3e114057d4d27a04cd22c03d3edcb7259 # master au 2026-11-24

      # terra : sans lui, deux tests pytest sont sautés (test_real_files, test_review_rules).
      - name: Paquets R (testthat, yaml, terra, sf, targets)
        run: Rscript -e 'install.packages(c("testthat", "yaml", "terra", "sf", "targets", "arrow"))'

      # r2u installe les binaires de CRAN au jour du build : une version exacte n'est pas garantie.
      # On la relève donc ici, pour que le résumé dise ce qui a réellement tourné.
      - name: Versions de R et des paquets (résumé)
        run: |
          {
            echo "### Versions R (binaires r2u, CRAN du jour du build : non figées)"
            Rscript -e 'cat(R.version.string, "\n"); for (p in c("testthat", "yaml", "terra", "sf", "targets", "arrow")) cat(p, as.character(packageVersion(p)), "\n")'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Python : uv, versions figées par les fichiers de contracts/ (rasterio inclus pour les tests).
      - name: Python (uv)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            contracts/requirements*.lock
            python/pyproject.toml

      - name: Dépendances Python
        run: |
          uv venv .venv
          # Dépendances verrouillées avec empreintes (relecture de la mission 009, I6).
          uv pip install --python .venv/bin/python --require-hashes -r contracts/requirements-tests.lock
          uv pip install --python .venv/bin/python --no-deps -e python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Une seule source de la commande de tests : tools/ci/run_tests.sh (la même que .claude/test-command).
      # Elle échoue si pytest saute un test, et écrit la durée de chaque section dans le résumé du job.
      - name: Tests (run_tests.sh r)
        run: |
          echo "### Durées des sections (r)" >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/run_tests.sh r


  # pytest des contrats, fixtures et python (make test-python, puis la session pytest des contrats).
  contrats:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # R : r2u fournit R et les paquets CRAN en binaires (apt), donc sans compilation.
      - name: R (r2u)
        uses: eddelbuettel/github-actions/r2u-setup@a28627a3e114057d4d27a04cd22c03d3edcb7259 # master au 2026-11-24

      # terra : sans lui, deux tests pytest sont sautés (test_real_files, test_review_rules).
      - name: Paquets R (testthat, yaml, terra, sf, targets)
        run: Rscript -e 'install.packages(c("testthat", "yaml", "terra", "sf", "targets", "arrow"))'

      # r2u installe les binaires de CRAN au jour du build : une version exacte n'est pas garantie.
      # On la relève donc ici, pour que le résumé dise ce qui a réellement tourné.
      - name: Versions de R et des paquets (résumé)
        run: |
          {
            echo "### Versions R (binaires r2u, CRAN du jour du build : non figées)"
            Rscript -e 'cat(R.version.string, "\n"); for (p in c("testthat", "yaml", "terra", "sf", "targets", "arrow")) cat(p, as.character(packageVersion(p)), "\n")'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Python : uv, versions figées par les fichiers de contracts/ (rasterio inclus pour les tests).
      - name: Python (uv)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            contracts/requirements*.lock
            python/pyproject.toml

      - name: Dépendances Python
        run: |
          uv venv .venv
          # Dépendances verrouillées avec empreintes (relecture de la mission 009, I6).
          uv pip install --python .venv/bin/python --require-hashes -r contracts/requirements-tests.lock
          uv pip install --python .venv/bin/python --no-deps -e python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Une seule source de la commande de tests : tools/ci/run_tests.sh (la même que .claude/test-command).
      # Elle échoue si pytest saute un test, et écrit la durée de chaque section dans le résumé du job.
      - name: Tests (run_tests.sh python contrats)
        run: |
          echo "### Durées des sections (python contrats)" >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/run_tests.sh python contrats


  # cargo test (dont le bout en bout de 100 ans). Python sert au validateur appelé par simulate.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # R : le bout en bout de simulate (tests/integration.rs) construit la zone fictive par make prepare biomes trees dynamics.
      - name: R (r2u)
        uses: eddelbuettel/github-actions/r2u-setup@a28627a3e114057d4d27a04cd22c03d3edcb7259 # master au 2026-11-24

      - name: Paquets R (testthat, yaml, terra, sf, targets)
        run: Rscript -e 'install.packages(c("testthat", "yaml", "terra", "sf", "targets", "arrow"))'

      # r2u installe les binaires de CRAN au jour du build : une version exacte n'est pas garantie.
      # On la relève donc ici, pour que le résumé dise ce qui a réellement tourné.
      - name: Versions de R et des paquets (résumé)
        run: |
          {
            echo "### Versions R (binaires r2u, CRAN du jour du build : non figées)"
            Rscript -e 'cat(R.version.string, "\n"); for (p in c("testthat", "yaml", "terra", "sf", "targets", "arrow")) cat(p, as.character(packageVersion(p)), "\n")'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Rust : chaîne figée par rustup, cache du registre et de la compilation (une clé par job :
      # les jobs tournent en parallèle et ne se disputent pas la même entrée).
      - name: Rust (rustup)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            simulate/target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('simulate/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ env.RUST_VERSION }}-

      # Python : uv, versions figées par les fichiers de contracts/ (rasterio inclus pour les tests).
      - name: Python (uv)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            contracts/requirements*.lock
            python/pyproject.toml

      - name: Dépendances Python
        run: |
          uv venv .venv
          # Dépendances verrouillées avec empreintes (relecture de la mission 009, I6).
          uv pip install --python .venv/bin/python --require-hashes -r contracts/requirements-tests.lock
          uv pip install --python .venv/bin/python --no-deps -e python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Une seule source de la commande de tests : tools/ci/run_tests.sh (la même que .claude/test-command).
      # Elle échoue si pytest saute un test, et écrit la durée de chaque section dans le résumé du job.
      - name: Tests (run_tests.sh rust)
        run: |
          echo "### Durées des sections (rust)" >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/run_tests.sh rust


  # Typage et tests node de la vue web. Python sert au vrai validateur du test d'intégration.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
