            contracts/requirements*.lock
            python/pyproject.toml

      - name: Dépendances Python
        run: |
          uv venv .venv
          # Dépendances verrouillées avec empreintes (relecture de la mission 009, I6).
          uv pip install --python .venv/bin/python --require-hashes -r contracts/requirements-tests.lock
          uv pip install --python .venv/bin/python --no-deps -e python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Node : npm ci à partir de package-lock.json, cache npm.
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: viewer-web/package-lock.json

      - name: Dépendances Node
        run: npm ci
        working-directory: viewer-web

      # Chromium pour les tests de la vue (tests/m4/test_m4_vue.py) ; version du paquet = PLAYWRIGHT_VERSION.
      - name: Navigateur des tests de la vue (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: viewer-web

      # Une seule source de la commande de tests : tools/ci/run_tests.sh (la même que .claude/test-command).
      # Elle échoue si pytest saute un test, et écrit la durée de chaque section dans le résumé du job.
      # validate après m4 : le validateur voit aussi les sorties d'assets (tuiles, web/), que le job m3 ne produit pas.
      # (validate reste aussi dans le job m3, qui valide le jeu fictif régénéré.)
      - name: Tests (run_tests.sh m4 validate)
        run: |
          echo "### Durées des sections (m4 validate)" >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/run_tests.sh m4 validate


  # Acceptation de post, volume et carbone (mission 052) : chaîne R, simulate (Rust, compilé en release avant les
  # tests, qui tournent sans réseau), post et assets sur 5 ans simulés. Sans Node ni Chromium : aucune vue n'y est testée.
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # R : r2u fournit R et les paquets CRAN en binaires (apt), donc sans compilation.
      - name: R (r2u)
        uses: eddelbuettel/github-actions/r2u-setup@a28627a3e114057d4d27a04cd22c03d3edcb7259 # master au 2026-11-24

      # terra : sans lui, deux tests pytest sont sautés (test_real_files, test_review_rules).
      - name: Paquets R (testthat, yaml, terra, sf, targets)
        run: Rscript -e 'install.packages(c("testthat", "yaml", "terra", "sf", "targets", "arrow"))'

      # r2u installe les binaires de CRAN au jour du build : une version exacte n'est pas garantie.
      # On la relève donc ici, pour que le résumé dise ce qui a réellement tourné.
      - name: Versions de R et des paquets (résumé)
        run: |
          {
            echo "### Versions R (binaires r2u, CRAN du jour du build : non figées)"
            Rscript -e 'cat(R.version.string, "\n"); for (p in c("testthat", "yaml", "terra", "sf", "targets", "arrow")) cat(p, as.character(packageVersion(p)), "\n")'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Rust : chaîne figée par rustup, cache du registre et de la compilation (une clé par job :
      # les jobs tournent en parallèle et ne se disputent pas la même entrée).
      - name: Rust (rustup)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            simulate/target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('simulate/Cargo.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-${{ env.RUST_VERSION }}-

      # Python : uv, versions figées par les fichiers de contracts/ (rasterio inclus pour les tests).
      - name: Python (uv)
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            contracts/requirements*.lock
            python/pyproject.toml

      - name: Dépendances Python
        run: |
          uv venv .venv
          # Dépendances verrouillées avec empreintes (relecture de la mission 009, I6).
          uv pip install --python .venv/bin/python --require-hashes -r contracts/requirements-tests.lock
          uv pip install --python .venv/bin/python --no-deps -e python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Une seule source de la commande de tests : tools/ci/run_tests.sh (la même que .claude/test-command).
      # Elle échoue si pytest saute un test, et écrit la durée de chaque section dans le résumé du job.
      - name: Tests (run_tests.sh post)
        run: |
          echo "### Durées des sections (post)" >> "$GITHUB_STEP_SUMMARY"
          bash tools/ci/run_tests.sh post


  # Vérifie seulement que Godot 4.6 et Playwright s'installent (spec §11, M0).
  # Non bloquant : un échec ici ne fait pas échouer la CI, donc ne bloque pas la release.
  outils-optionnels:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Godot
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          D="$RUNNER_TEMP/godot"; mkdir -p "$D"
          curl -fsSL -o "$D/godot.zip" "$URL"
          unzip -q "$D/godot.zip" -d "$D"
          chmod +x "$D/Godot_v${GODOT_VERSION}_linux.x86_64"
          V=$("$D/Godot_v${GODOT_VERSION}_linux.x86_64" --headless --version)
          echo "Godot : $V" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installer Playwright (Chromium)
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/playwright"; mkdir -p "$D"
          cd "$D"
          npm init -y >/dev/null
          npm install "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          echo "Playwright ${PLAYWRIGHT_VERSION} : installé" >> "$GITHUB_STEP_SUMMARY"
