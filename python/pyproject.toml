[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sylvigenese"
version = "0.0.1"
description = "Modules Python de sylvigenese : import_tarif, post, assets (squelette, mission 012)"
requires-python = ">=3.13"
license = { text = "GPL-3.0-only" }
dependencies = ["PyYAML>=6", "pyarrow>=26"]

[project.optional-dependencies]
test = ["pytest>=9"]

[tool.setuptools]
packages = ["sylvigenese"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
